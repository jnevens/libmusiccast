# CI: cppcheck, tests/coverage, release tarball (make distcheck), and .deb packages.
#
# Artifacts: cppcheck.log, coverage/, release/*.tar.gz, deb/*.deb

stages:
  - test
  - build

variables:
  # Required when --enable-gcov is used (see m4/gcov.m4).
  CCACHE_DISABLE: "1"
  # Uninstalled libtool build: tests link against libmusiccast.so in src/.libs
  LD_LIBRARY_PATH: "${CI_PROJECT_DIR}/src/.libs"
  APT_PACKAGES: >-
    autoconf automake libtool pkg-config
    build-essential
    libcurl4-openssl-dev libjson-c-dev
    check libsubunit-dev
    lcov gcovr

.test_image:
  image: ubuntu:24.04
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq
    - apt-get install -y -qq ${APT_PACKAGES}

cppcheck:
  extends: .test_image
  stage: test
  variables:
    APT_PACKAGES: >-
      autoconf automake libtool pkg-config
      build-essential
      libcurl4-openssl-dev libjson-c-dev
      cppcheck
  script:
    - autoreconf -fi
    - ./configure --disable-valgrind
    - ./scripts/cppcheck.sh 2>&1 | tee cppcheck.log
  artifacts:
    when: always
    expire_in: 30 days
    expose_as: "cppcheck report"
    paths:
      - cppcheck.log

build-test-coverage:
  extends: .test_image
  stage: test
  script:
    - autoreconf -fi
    - ./configure --enable-tests --enable-gcov --disable-valgrind
    - export LD_LIBRARY_PATH="${CI_PROJECT_DIR}/src/.libs${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
    - make coverage AM_COLOR_TESTS=always
    - lcov --summary coverage.info | tee coverage-summary.txt
    - |
      gcovr -r "${CI_PROJECT_DIR}" \
        --filter "${CI_PROJECT_DIR}/src/" \
        --cobertura "${CI_PROJECT_DIR}/coverage/cobertura.xml"
  coverage: '/lines\.*: (\d+\.\d+)%/'
  artifacts:
    when: always
    expire_in: 30 days
    expose_as: "build tests and coverage"
    paths:
      - coverage/
      - coverage.info
      - coverage-summary.txt
      - tests/test-suite.log
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml

# Verify Makefile.am EXTRA_DIST, VPATH build, install/uninstall; ship tarball.
distcheck:
  extends: .test_image
  stage: build
  variables:
    APT_PACKAGES: >-
      autoconf automake libtool pkg-config
      build-essential
      libcurl4-openssl-dev libjson-c-dev
  script:
    - autoreconf -fi
    - ./configure --disable-valgrind
    - make distcheck
    - mkdir -p "${CI_PROJECT_DIR}/release"
    - mv libmusiccast-*.tar.gz "${CI_PROJECT_DIR}/release/"
  artifacts:
    when: always
    expire_in: 30 days
    expose_as: "source tarball"
    paths:
      - release/

# Binary packages (library, -dev, mcctl).
build-deb:
  extends: .test_image
  stage: build
  variables:
    APT_PACKAGES: >-
      autoconf automake libtool pkg-config
      build-essential
      libcurl4-openssl-dev libjson-c-dev
      debhelper devscripts fakeroot
  script:
    - dpkg-buildpackage -b -us -uc
    - mkdir -p "${CI_PROJECT_DIR}/deb"
    - mv ../libmusiccast0_*.deb ../libmusiccast-dev_*.deb ../libmusiccast-tools_*.deb "${CI_PROJECT_DIR}/deb/"
  artifacts:
    when: always
    expire_in: 30 days
    expose_as: "debian packages"
    paths:
      - deb/
