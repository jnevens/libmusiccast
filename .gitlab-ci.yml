# CI: cppcheck, tests/coverage, release tarball (make distcheck), .deb packages,
# and optional publish to GitHub on version tags.
#
# Artifacts: cppcheck.log, coverage/, release/*.tar.gz, deb/*.deb
#
# GitHub publish (job publish-github, tags v* only):
#   GITHUB_DEPLOY_KEY — CI variable, type File (deploy key with write access)
#   GITHUB_REPO_SSH   — optional; default git@github.com:jnevens/libmusiccast.git
#   GITHUB_TOKEN      — optional masked PAT; uploads distcheck .tar.gz to GitHub Releases
# publish-github runs manually after test/build jobs succeed (Play in pipeline UI).

stages:
  - test
  - build
  - release

variables:
  # Required when --enable-gcov is used (see m4/gcov.m4).
  CCACHE_DISABLE: "1"
  # Uninstalled libtool build: tests link against libmusiccast.so in src/.libs
  LD_LIBRARY_PATH: "${CI_PROJECT_DIR}/src/.libs"
  GITHUB_REPO_SSH: "git@github.com:jnevens/libmusiccast.git"
  APT_PACKAGES: >-
    autoconf automake libtool pkg-config
    build-essential
    libcurl4-openssl-dev libjson-c-dev
    check libsubunit-dev
    lcov gcovr

.test_image:
  image: ubuntu:24.04
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq
    - apt-get install -y -qq ${APT_PACKAGES}

cppcheck:
  extends: .test_image
  stage: test
  variables:
    APT_PACKAGES: >-
      autoconf automake libtool pkg-config
      build-essential
      libcurl4-openssl-dev libjson-c-dev
      cppcheck
  script:
    - autoreconf -fi
    - ./configure --disable-valgrind
    - ./scripts/cppcheck.sh 2>&1 | tee cppcheck.log
  artifacts:
    when: always
    expire_in: 30 days
    expose_as: "cppcheck report"
    paths:
      - cppcheck.log

build-test-coverage:
  extends: .test_image
  stage: test
  script:
    - autoreconf -fi
    - ./configure --enable-tests --enable-gcov --disable-valgrind
    - export LD_LIBRARY_PATH="${CI_PROJECT_DIR}/src/.libs${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
    - make coverage AM_COLOR_TESTS=always
    - lcov --summary coverage.info | tee coverage-summary.txt
    - |
      gcovr -r "${CI_PROJECT_DIR}" \
        --filter "${CI_PROJECT_DIR}/src/" \
        --cobertura "${CI_PROJECT_DIR}/coverage/cobertura.xml"
  coverage: '/lines\.*: (\d+\.\d+)%/'
  artifacts:
    when: always
    expire_in: 30 days
    expose_as: "build tests and coverage"
    paths:
      - coverage/
      - coverage.info
      - coverage-summary.txt
      - tests/test-suite.log
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml

# Verify Makefile.am EXTRA_DIST, VPATH build, install/uninstall; ship tarball.
distcheck:
  extends: .test_image
  stage: build
  variables:
    APT_PACKAGES: >-
      autoconf automake libtool pkg-config
      build-essential
      libcurl4-openssl-dev libjson-c-dev
  script:
    - autoreconf -fi
    - ./configure --disable-valgrind
    - make distcheck
    - mkdir -p "${CI_PROJECT_DIR}/release"
    - mv libmusiccast-*.tar.gz "${CI_PROJECT_DIR}/release/"
  artifacts:
    when: always
    expire_in: 30 days
    expose_as: "source tarball"
    paths:
      - release/

# Binary packages (library, -dev, mcctl).
build-deb:
  extends: .test_image
  stage: build
  variables:
    APT_PACKAGES: >-
      autoconf automake libtool pkg-config
      build-essential
      libcurl4-openssl-dev libjson-c-dev
      debhelper devscripts fakeroot
  script:
    - dpkg-buildpackage -b -us -uc
    - mkdir -p "${CI_PROJECT_DIR}/deb"
    - mv ../libmusiccast0_*.deb ../libmusiccast-dev_*.deb "${CI_PROJECT_DIR}/deb/"
  artifacts:
    when: always
    expire_in: 30 days
    expose_as: "debian packages"
    paths:
      - deb/

# Push master + tag to public GitHub after tests and distcheck succeed.
publish-github:
  image: ubuntu:24.04
  stage: release
  when: manual
  allow_failure: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  needs:
    - job: cppcheck
    - job: build-test-coverage
    - job: distcheck
      artifacts: true
  variables:
    GIT_DEPTH: "0"
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq
    - apt-get install -y -qq git openssh-client ca-certificates
  script:
    - |
      set -eu
      if [ -z "${GITHUB_DEPLOY_KEY:-}" ] || [ ! -f "${GITHUB_DEPLOY_KEY}" ]; then
        echo "Set CI variable GITHUB_DEPLOY_KEY (type File) with the GitHub deploy key." >&2
        exit 1
      fi
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
      chmod 600 "${GITHUB_DEPLOY_KEY}"
      eval "$(ssh-agent -s)"
      ssh-add "${GITHUB_DEPLOY_KEY}"
      git remote remove github 2>/dev/null || true
      git remote add github "${GITHUB_REPO_SSH}"
      git fetch origin "refs/heads/master:refs/remotes/origin/master"
      if ! git merge-base --is-ancestor "${CI_COMMIT_SHA}" origin/master; then
        echo "Tag ${CI_COMMIT_TAG} is not on branch master; refusing to publish." >&2
        exit 1
      fi
      echo "Publishing ${CI_COMMIT_TAG} (${CI_COMMIT_SHA}) to GitHub..."
      git push github "HEAD:refs/heads/master"
      git push github "${CI_COMMIT_TAG}"
      if [ -n "${GITHUB_TOKEN:-}" ]; then
        apt-get install -y -qq gh
        printf '%s\n' "${GITHUB_TOKEN}" | gh auth login --with-token
        gh auth setup-git
        TARBALL="$(ls release/libmusiccast-*.tar.gz | head -1)"
        if gh release view "${CI_COMMIT_TAG}" >/dev/null 2>&1; then
          gh release upload "${CI_COMMIT_TAG}" "${TARBALL}" --clobber
        else
          gh release create "${CI_COMMIT_TAG}" "${TARBALL}" \
            --title "${CI_COMMIT_TAG}" --generate-notes --verify-tag
        fi
      else
        echo "GITHUB_TOKEN not set; skipped GitHub Release asset upload (git push only)."
        echo "GitHub still provides auto-generated source archives for the tag."
      fi
